name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

# конвеєру досить читати код, писати в репозиторій йому не треба
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v7

      - name: Установити .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # на образі runner можуть бути й новіші SDK, тож версію виводимо в анотацію
      - name: Показати версію SDK
        run: echo "::notice::.NET SDK $(dotnet --version)"

      - name: Відновити залежності
        run: dotnet restore

      - name: Перевірка форматування
        run: dotnet format --verify-no-changes --no-restore

      - name: Складання Release з аналізаторами
        run: dotnet build -c Release --no-restore

      - name: Тести й покриття
        run: >
          dotnet test -c Release --no-build
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=60 /p:ThresholdType=line

      - name: Зберегти звіт про покриття
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'
